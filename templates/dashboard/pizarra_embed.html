{% extends 'base.html' %}
{% block title %}Pizarra - Innovex Soporte{% endblock %}
{% block content %}
<div style="padding: 2rem;">
<h2 class="section-title">Bitácora / Pizarra de Turno</h2>
<div class="card glass-effect" style="margin-bottom: 3rem; padding: 1.5rem; position: relative;">
    <p style="margin-top: 0; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.9rem;">
        📝 Handover rápido para el equipo. <span id="bitacora-status" style="float: right; color: var(--success); font-size: 0.8rem;">Última act: {{ bitacora.actualizado_en|date:"d/m/Y H:i" }}</span>
    </p>
    <textarea id="bitacora-texto" class="glass-effect" style="width: 100%; height: 300px; resize: vertical; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2); color: var(--text-primary); padding: 1rem; border-radius: 8px; font-family: monospace; font-size: 1.1rem; line-height: 1.5;">{{ bitacora.texto }}</textarea>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const textarea = document.getElementById('bitacora-texto');
    const statusSpan = document.getElementById('bitacora-status');
    let bitacoraTimeout;

    if(textarea) {
        textarea.addEventListener('input', function() {
            statusSpan.textContent = 'Escribiendo...';
            statusSpan.style.color = 'var(--warning)';
            
            clearTimeout(bitacoraTimeout);
            bitacoraTimeout = setTimeout(() => {
                statusSpan.textContent = 'Guardando...';
                fetch("{% url 'actualizar_bitacora' %}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                    body: JSON.stringify({texto: textarea.value})
                })
                .then(r => r.json())
                .then(d => {
                    if(d.status === 'ok') {
                        statusSpan.textContent = 'Guardado ' + d.actualizado_en;
                        statusSpan.style.color = 'var(--success)';
                    }
                });
            }, 1000);
        });

        // Actualización periódica (Polling)
        setInterval(() => {
            // Solo actualizamos si el usuario no tiene el cursor puesto en la pizarra (para no interrumpir su escritura)
            if (document.activeElement !== textarea) {
                fetch("{% url 'actualizar_bitacora' %}")
                .then(r => r.json())
                .then(d => {
                    if (d.status === 'ok') {
                        // Si el texto que viene del servidor es diferente al actual, lo actualizamos
                        if (textarea.value !== d.texto) {
                            textarea.value = d.texto;
                            statusSpan.textContent = 'Actualizado ' + d.actualizado_en;
                            statusSpan.style.color = 'var(--success)';
                        }
                    }
                })
                .catch(err => console.error("Error al actualizar pizarra:", err));
            }
        }, 5000); // Revisa cada 5 segundos
    }
});
</script>


</div>
{% endblock %}
