{% extends 'base.html' %}

{% block title %}Calendario - Innovex Soporte{% endblock %}

{% block content %}
<style>
    .cal-container {
        padding: 20px;
        width: 100%;
        max-width: 1400px;
        margin: 0;
    }
    .cal-header-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 16px;
        gap: 16px;
    }
    .cal-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--text-primary);
        margin: 0 0 4px 0;
        letter-spacing: -0.5px;
    }
    .cal-sub {
        font-size: 0.88rem;
        color: var(--text-secondary);
        margin: 0;
    }
    .btn-open-sheet {
        background: var(--bg-card);
        color: var(--text-primary);
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        text-decoration: none;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
    }
    .btn-open-sheet:hover {
        border-color: #f59e0b;
        color: #f59e0b;
    }
    .cal-iframe-wrapper {
        width: 100%;
        height: calc(100vh - 170px);
        min-height: 750px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
</style>

<div class="cal-container">
    <div class="cal-header-bar">
        <div>
            <h1 class="cal-title">Calendario de Turnos y Actividades</h1>
            <p class="cal-sub">Visualización en pantalla completa de la planificación de turnos desde Google Sheets.</p>
        </div>
        <a href="https://docs.google.com/spreadsheets/d/1Qt4UWxIGL04N9z2cVY3dm5hPQuigHMh-3arxlH21pCs/edit" target="_blank" class="btn-open-sheet">
            ↗ Abrir en Google Sheets
        </a>
    </div>

    <div class="cal-iframe-wrapper">
        <iframe
            src="https://docs.google.com/spreadsheets/d/1Qt4UWxIGL04N9z2cVY3dm5hPQuigHMh-3arxlH21pCs/htmlembed?gid=567077492"
            width="100%" height="100%" frameborder="0" style="display: block;">
        </iframe>
    </div>
</div>
{% endblock %}
