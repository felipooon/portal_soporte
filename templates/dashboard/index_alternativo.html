{% load static %}
<!DOCTYPE html>
<html lang="es-cl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Soporte - Innovex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        .spa-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-dark);
        }
        .spa-sidebar {
            width: 250px;
            background: var(--bg-card);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .spa-brand {
            padding: 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            text-decoration: none;
            color: white;
            font-size: 1.1rem;
        }
        .spa-brand img {
            height: 24px;
            margin-right: 10px;
        }
        .spa-nav {
            flex: 1;
            padding: 10px 0;
            overflow-y: auto;
        }
        .spa-nav-item {
            display: block;
            padding: 15px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
        }
        .spa-nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
        .spa-nav-item.active {
            background: rgba(var(--primary-rgb), 0.1);
            color: var(--primary);
            border-left-color: var(--primary);
        }
        .spa-content {
            flex: 1;
            background: var(--bg-dark);
            position: relative;
        }
        .spa-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    <div class="spa-layout glass-effect">
        <aside class="spa-sidebar">
            <a href="{% url 'dashboard_alternativo' %}" class="spa-brand">
                <img src="https://dataweb.innovex.cl/static/img/innovex.png" alt="Innovex Logo">
                <span><span style="color: #f1c40f;">In</span>novex</span>
            </a>
            <nav class="spa-nav">
                <div style="padding: 10px 20px; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; color: var(--text-secondary); opacity: 0.7; margin-top: 5px;">Inicio</div>
                <div class="spa-nav-item active" onclick="loadTool(this, '{% url 'pizarra_embed' %}?embed=1')">
                    🏠 Pizarra de Turno
                </div>
                
                <div style="padding: 10px 20px; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; color: var(--text-secondary); opacity: 0.7; margin-top: 15px;">Herramientas Soporte</div>
                <div class="spa-nav-item" onclick="loadTool(this, '{% url 'correos_masivos' %}?embed=1')">
                    ✉️ Correos Masivos
                </div>
                <div class="spa-nav-item" onclick="loadTool(this, '/certificado/?embed=1')">
                    📄 Certificado de Instalaciones
                </div>
                
                <div style="padding: 10px 20px; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; color: var(--text-secondary); opacity: 0.7; margin-top: 15px;">Planillas y Reportes</div>
                <div class="spa-nav-item" onclick="loadTool(this, '{% url 'planillas_embed' %}?embed=1')">
                    📂 Planillas Drive
                </div>
                <div class="spa-nav-item" onclick="loadTool(this, '{% url 'calendario' %}?embed=1')">
                    📅 Calendario
                </div>
                
                <div style="padding: 10px 20px; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; color: var(--text-secondary); opacity: 0.7; margin-top: 15px;">Servicios Innovex</div>
                <div class="spa-nav-item" onclick="window.open('https://dataweb.innovex.cl', '_blank')" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>🌐 Dataweb</span><span style="font-size: 0.8em; opacity: 0.5;">↗</span>
                </div>
                <div class="spa-nav-item" onclick="window.open('https://nextcore.innovex.cl/monitor', '_blank')" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>🖥️ Nextcore</span><span style="font-size: 0.8em; opacity: 0.5;">↗</span>
                </div>
                <div class="spa-nav-item" onclick="window.open('https://erp.innovex.cl/web#action=106&model=calendar.event&view_type=calendar&menu_id=81', '_blank')" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>⚙️ Odoo</span><span style="font-size: 0.8em; opacity: 0.5;">↗</span>
                </div>
                <div class="spa-nav-item" onclick="loadTool(this, '{% url 'poseidon' %}?embed=1')">
                    🔱 Poseidón
                </div>
            </nav>
        </aside>
        <main class="spa-content">
            <iframe id="main-frame" class="spa-iframe" src="{% url 'pizarra_embed' %}?embed=1"></iframe>
        </main>
    </div>

    <script>
        function loadTool(element, url) {
            // Update active state
            document.querySelectorAll('.spa-nav-item').forEach(el => el.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            }

            // Update iframe src
            document.getElementById('main-frame').src = url;
            
            // Save state
            localStorage.setItem('currentToolUrl', url);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('currentToolUrl');
            if (savedUrl) {
                // Find the sidebar item that matches this URL
                const navItems = document.querySelectorAll('.spa-nav-item');
                let found = false;
                for (let el of navItems) {
                    const onclickAttr = el.getAttribute('onclick');
                    if (onclickAttr && onclickAttr.includes(savedUrl)) {
                        // Just update classes and src to avoid recursive loadTool call if we want
                        document.querySelectorAll('.spa-nav-item').forEach(e => e.classList.remove('active'));
                        el.classList.add('active');
                        document.getElementById('main-frame').src = savedUrl;
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    document.getElementById('main-frame').src = savedUrl;
                }
            }
        });
    </script>
</body>
</html>
