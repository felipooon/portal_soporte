{% extends "base.html" %}

{% block title %}Poseidón - Monitor Inyección{% endblock %}

{% block content %}
<header style="text-align: center; margin-bottom: 2rem;">
    <h1>Poseidón</h1>
    <p class="subtitle">Monitor de tableros de inyección multipantalla</p>
    <a href="{% url 'index' %}" class="btn" style="display: inline-block; padding: 10px 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; text-decoration: none; margin-top: 10px; transition: 0.3s;">
        ← Volver al Dashboard
    </a>
</header>

<div style="display: flex; gap: 20px; height: 75vh; width: 100%;">
    <!-- Columna Llancacheo -->
    <div class="card glass-effect" style="flex: 1; display: flex; flex-direction: column; padding: 15px;">
        <h3 style="margin-top: 0; text-align: center; color: var(--text-primary); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
            📍 Llancacheo Inyección
        </h3>
        <iframe src="http://ce-llancacheo-inyeccion.acuimatic.com:8000/" 
                style="flex: 1; border: none; border-radius: 8px; background: #fff;" 
                title="Llancacheo"></iframe>
    </div>

    <!-- Columna Aulen -->
    <div class="card glass-effect" style="flex: 1; display: flex; flex-direction: column; padding: 15px;">
        <h3 style="margin-top: 0; text-align: center; color: var(--text-primary); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
            📍 Aulen Inyección
        </h3>
        <iframe src="http://ce-aulen-inyeccion.acuimatic.com:8000/" 
                style="flex: 1; border: none; border-radius: 8px; background: #fff;" 
                title="Aulen"></iframe>
    </div>
</div>
{% endblock %}
