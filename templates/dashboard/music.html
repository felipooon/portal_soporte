{% extends "base.html" %}

{% block title %}Control de Música{% endblock %}

{% block content %}
<style>
    .music-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
        gap: 30px;
    }
    
    .player-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        text-align: center;
    }
    
    .player-title {
        color: white;
        font-size: 1.5rem;
        margin-bottom: 30px;
        font-weight: 600;
    }

    .controls {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 30px;
        align-items: center;
    }
    
    .btn-control {
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        transition: all 0.3s ease;
    }
    
    .btn-control:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.1);
    }
    
    .btn-play {
        width: 65px;
        height: 65px;
        background: #f1c40f;
        color: #1a1a2e;
        font-size: 1.5rem;
    }
    
    .btn-play:hover {
        background: #f39c12;
    }

    .volume-controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    .search-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 20px;
        width: 100%;
        max-width: 400px;
    }

    .search-input {
        width: 100%;
        padding: 15px 20px;
        border-radius: 10px;
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 1rem;
        outline: none;
        box-sizing: border-box;
    }
    
    .search-input::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }

    .search-btn {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .search-btn:hover {
        background: #c0392b;
    }

    .notification {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #2ecc71;
        color: white;
        padding: 15px 25px;
        border-radius: 10px;
        transform: translateY(100px);
        opacity: 0;
        transition: all 0.3s ease;
        z-index: 1000;
    }

    .notification.show {
        transform: translateY(0);
        opacity: 1;
    }
</style>

<!-- Feather Icons for beautiful UI icons -->
<script src="https://unpkg.com/feather-icons"></script>

<div class="music-container">
    <div class="player-card">
        <div class="player-title">🎵 Reproductor de Chrome</div>
        
        <div class="controls">
            <button class="btn-control" onclick="sendCommand('prev')" title="Anterior">
                <i data-feather="skip-back"></i>
            </button>
            <button class="btn-control btn-play" onclick="sendCommand('play')" title="Play / Pausa">
                <i data-feather="play"></i>
            </button>
            <button class="btn-control" onclick="sendCommand('next')" title="Siguiente">
                <i data-feather="skip-forward"></i>
            </button>
        </div>
        
        <div class="volume-controls">
            <button class="btn-control" onclick="sendCommand('voldn')" title="Bajar Volumen">
                <i data-feather="volume-1"></i>
            </button>
            <button class="btn-control" onclick="sendCommand('mute')" title="Mute / Desmute">
                <i data-feather="volume-x"></i>
            </button>
            <button class="btn-control" onclick="sendCommand('volup')" title="Subir Volumen">
                <i data-feather="volume-2"></i>
            </button>
        </div>
    </div>

    <div class="search-card">
        <form onsubmit="searchYoutube(event)">
            <input type="text" id="yt-search" class="search-input" placeholder="Buscar canción en YouTube...">
            <button type="submit" class="search-btn">
                <i data-feather="search" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 5px;"></i>
                Buscar en YouTube
            </button>
        </form>
    </div>
</div>

<div id="notification" class="notification">Comando enviado</div>

<script>
    feather.replace();

    let playState = false;

    function showNotification(message, isError = false) {
        const notif = document.getElementById('notification');
        notif.textContent = message;
        notif.style.background = isError ? '#e74c3c' : '#2ecc71';
        notif.classList.add('show');
        setTimeout(() => {
            notif.classList.remove('show');
        }, 2000);
    }

    function sendCommand(action) {
        // Optimistic UI for play/pause toggle
        if (action === 'play') {
            playState = !playState;
            const playBtn = document.querySelector('.btn-play');
            if (playState) {
                playBtn.innerHTML = '<i data-feather="pause"></i>';
            } else {
                playBtn.innerHTML = '<i data-feather="play"></i>';
            }
            feather.replace();
        }

        fetch(`/api/music/control/?action=${action}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    showNotification('Comando ejecutado: ' + action);
                } else {
                    showNotification('Error: ' + data.message, true);
                }
            })
            .catch(err => {
                showNotification('Error de conexión', true);
            });
    }

    function searchYoutube(event) {
        event.preventDefault();
        const query = document.getElementById('yt-search').value.trim();
        if (query) {
            fetch(`/api/music/control/?action=search&query=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        showNotification('Buscando en el PC Host: ' + query);
                        document.getElementById('yt-search').value = '';
                    } else {
                        showNotification('Error al buscar: ' + data.message, true);
                    }
                })
                .catch(err => {
                    showNotification('Error de conexión', true);
                });
        }
    }
</script>
{% endblock %}
